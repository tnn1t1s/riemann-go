[pytest]
testpaths = tests
addopts = -ra
markers =
    P1: routed events reach their sink
    P2: ingest answers truthfully
    P3: validation fails fast
    P4: expiry is an event, not a deletion
    P5: an event reaches the index only through an index leaf
    P6: index query selects by expression
    P7: by partitions state
    P8: changed-state suppresses repeats
    P9: throttle bounds firings per window
    P10: splitp selects one branch
    P11: set rewrites before the sink sees it
    P12: timers are ordered against events, and run on the wall clock
    P13: every alert carries its provenance
    P14: rules are idempotent by content
    P15: dry run touches nothing live
    P16: a drop is counted, never silent
    P17: missing configuration is fatal
    http_surface: SPEC.md HTTP surface (normative)
    expression_language: SPEC.md expression language
    coalesce: SEMANTICS.md coalesce
    ddt: SEMANTICS.md ddt
    stable: SEMANTICS.md stable
    holdout: held-out set; runs at promotion only

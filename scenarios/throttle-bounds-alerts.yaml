name: throttle-bounds-alerts
description: >
  throttle passes at most `limit` events per `window_seconds` and drops the
  rest. A stream flapping once a second through changed-state produces twenty
  transitions; a throttle of 2 per 10 s must let a small bounded number
  through, not twenty. Ported from streams_test.clj throttle-test, and the
  shape the fleet's ntfy.listen.connected rule uses to keep a flapping
  listener reading as one burst rather than a page per flip.

  The bound is asserted globally over the run rather than per window, because
  the five operators have no time arithmetic. The stimulus spans twenty
  seconds and the settle adds three, so at most three windows are touched and
  the ceiling is 3 x limit. See HARNESS.md "Why there is no within_seconds".

settle_seconds: 3

rules:
  - id: listener-flap
    owner: ops
    partition: host
    match: 'service == "ntfy.listen.connected"'
    stream:
      op: changed-state
      initial: ok
      children:
        - op: by
          fields: [host, service]
          children:
            - op: throttle
              limit: 2
              window_seconds: 10
              children:
                - { sink: ntfy }

stimulus:
  # Twenty alternating events, one per second. Every one is a transition, so
  # changed-state forwards all twenty and the throttle is what bounds them.
  - at: 0s
    emit_n:
      count: 20
      interval: 1s
      batch_size: 1
      template:
        host: ghost
        service: ntfy.listen.connected
        state: "{i}"
        ttl: 300

expect:
  trace:
    contains:
      - { event: ntfy_post, host: ghost, service: ntfy.listen.connected }

    not_contains:
      - { event: ingest_response, status: 429 }

    order:
      - before: { event: ingest_response, status: 202 }
        after:  { event: ntfy_post, service: ntfy.listen.connected }

    count:
      # Not more. Twenty transitions in, at most six out across three windows.
      - match: { event: ntfy_post, service: ntfy.listen.connected }
        min: 2
        max: 6

    field_exists:
      - match: { event: ntfy_post, service: ntfy.listen.connected }
        field: rule

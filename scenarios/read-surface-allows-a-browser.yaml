name: read-surface-allows-a-browser
description: >
  The read surface answers a browser, which means every response carries
  Access-Control-Allow-Origin. SPEC.md "HTTP surface (normative)".

  This is here because production found it and the corpus could not. The
  dashboard loads its page from one origin and subscribes to riemann-go on
  another, so without the header every subscription is refused before a byte
  is read: no error in the server, no failed request in its metrics, just
  empty panes. The harness drives the server from Python, where the
  same-origin policy does not exist, so nothing here would ever have noticed.

  Expected duration: about 7 seconds.

settle_seconds: 3

rules:
  - id: index-everything
    owner: arena
    partition: host
    match: 'true'
    stream: { op: where, expr: 'true', children: [ { sink: index } ] }

stimulus:
  - at: 0s
    emit:
      events:
        - host: browser-probe
          service: cors.probe
          state: ok
          metric: 1
          ttl: 120

  - at: 1s
    query_index: 'service == "cors.probe"'

expect:
  trace:
    contains:
      # The query worked at all.
      - { event: query_response, kind: index, status: 200, match_count: 1 }

    field_exists:
      # And a browser would have been allowed to read it. Catches the
      # implementation that serves the right body to curl and nothing to the
      # dashboard.
      - match: { event: query_response, kind: index }
        field: allow_origin

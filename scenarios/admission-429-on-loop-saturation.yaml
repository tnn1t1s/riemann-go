name: admission-429-on-loop-saturation
description: >
  The case that does produce a 429, and the emitter sees it. When the shard
  inbox is full and stays full past the admission deadline, the reply is 429
  with an accepted count and a rejected count, and the admitted events are not
  rolled back. SPEC.md property 2 and "Wire and backpressure".

  Saturation is produced by configuring SCALE.md's own parameters, not by a
  probe-only knob: a tiny inbox and a one-millisecond deadline mean a batch
  larger than the inbox cannot be fully admitted at any loop speed. That makes
  the property reachable without a 3.4-million-events-per-second flood from
  Python. It also means the scenario tests the admission path rather than the
  loop's throughput; see HARNESS.md "What this corpus does not cover".

config:
  engine.shards: 1
  shard.inbox_capacity: 8
  ingest.admission_deadline: 1

rules:
  - id: archive-all
    owner: arena
    partition: host
    match: "true"
    stream: { sink: influx }

settle_seconds: 10

stimulus:
  # One batch of 500 into an inbox of 8, with a 1 ms deadline. Some prefix is
  # admitted; the remainder is rejected and counted.
  - at: 0s
    emit:
      events:
        - { host: ghost, service: flood.event, state: ok, metric: 1, ttl: 300 }
  - at: 0.2s
    emit_n:
      count: 500
      batch_size: 500
      template:
        host: "host-{i}"
        service: flood.event
        state: ok
        metric: 1
        ttl: 300

expect:
  trace:
    contains:
      # The emitter sees it. This is the whole property.
      - { event: ingest_response, status: 429 }
      # The single event posted before the flood was admitted normally.
      - { event: ingest_response, status: 202, accepted: 1 }

    not_contains:
      # A saturated loop is not a malformed request.
      - { event: ingest_response, status: 400 }
      - { event: ingest_response, status: 500 }

    order:
      - before: { event: ingest_response, status: 202 }
        after:  { event: ingest_response, status: 429 }

    count:
      - match: { event: ingest_response, status: 429 }
        equals: 1
      # Admitted events are not rolled back: what got in still reaches influx.
      - match: { event: influx_write, host: ghost }
        min: 1

    field_exists:
      # A 429 that does not say how many were admitted leaves the emitter
      # unable to count its own loss, which is the contract in the emitter contract in riemann-atlas's VOCABULARY.md.
      - match: { event: ingest_response, status: 429 }
        field: accepted
      - match: { event: ingest_response, status: 429 }
        field: rejected

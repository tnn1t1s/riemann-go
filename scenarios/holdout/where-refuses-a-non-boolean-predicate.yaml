name: where-refuses-a-non-boolean-predicate
description: >
  Source: upstream `where-test` "return value" and `where*-test`, both of which
  establish that upstream's `where` treats any truthy value as a match:
  `((where 2) :wheeee!)` returns 2 and `(where metric)` passes every event
  carrying a non-nil metric. SEMANTICS.md `where`, first edge case, states the
  riemann-go behavior and the reason: a `where` expression whose type is not
  boolean fails to compile, which is a 400 at `PUT`, and it is not a
  truthiness coercion at evaluation time. "A predicate that is accidentally a
  projection fires on everything, and that is the failure mode hardest to
  notice once a rule is live."

  So this is the same upstream case with the verdict inverted. Upstream asserts
  the coercion happens; riemann-go asserts it is refused before the rule can
  ever run.

  The rejection is asserted at the rule surface rather than at the oracle,
  which HARNESS.md's trace vocabulary allows for rule registration, and the
  consequence is asserted at the oracle: the rejected rule never posts. Both
  halves are needed. A generation that returns 400 and installs the rule anyway
  fails the silence, and one that installs the rule and simply never fires it
  passes the silence for the wrong reason.

  The second rejected rule is the closed-world statement from SPEC.md's
  expression language: an unknown top-level name is a compile error at `PUT`,
  rather than a rule that silently never fires. It shares this scenario because
  it is the same discipline, and it carries its own rule id so a failure says
  which half broke.

  `live-control` is here so the silence is provable. Without it, an
  implementation that dropped every event on the floor would satisfy both
  not_contains clauses.

  Wrong implementations this catch: upstream's truthiness coercion ported
  directly, which posts an extra alert per event from `truthy-where`; a `PUT`
  that accepts any expression that parses and defers the type error to
  evaluation; an expression engine with an open name domain, where
  `bogus_name` reads as null and the rule compiles.

  Every event carries a metric, so the scenario never depends on SEMANTICS.md
  Open question 1, the reading of `metric` on an event that carries none.

  Expected wall clock: about 1.4 s of stimulus plus a 5 s settle.

settle_seconds: 5

rules:
  # Fires on every probe event, so the two silences below are silences and not
  # an empty pipeline.
  - id: live-control
    owner: arena
    partition: host
    match: 'service == "pred.probe"'
    stream:
      op: where
      expr: "metric > 0"
      children:
        - { sink: ntfy }

stimulus:
  # A projection where a predicate belongs. Upstream matches every event with a
  # metric; riemann-go refuses the rule.
  - at: 0.0s
    put_rule:
      id: truthy-where
      rule:
        id: truthy-where
        owner: arena
        partition: host
        match: 'service == "pred.probe"'
        stream:
          op: where
          expr: "metric"
          children:
            - { sink: ntfy }

  # A name the engine does not supply. SPEC.md: "The world is closed."
  - at: 0.3s
    put_rule:
      id: open-world-where
      rule:
        id: open-world-where
        owner: arena
        partition: host
        match: 'service == "pred.probe"'
        stream:
          op: where
          expr: "bogus_name == 1"
          children:
            - { sink: ntfy }

  - at: 1.0s
    emit:
      events: [{ host: ghost, service: pred.probe, state: ok, metric: 1, ttl: 300 }]
  - at: 1.4s
    emit:
      events: [{ host: ghost, service: pred.probe, state: ok, metric: 2, ttl: 300 }]

expect:
  trace:
    contains:
      - { event: rule_response, kind: put, id: truthy-where, status: 400 }
      - { event: rule_response, kind: put, id: open-world-where, status: 400 }
      # The pipeline is alive.
      - { event: ntfy_post, rule: live-control, metric: 1 }
      - { event: ntfy_post, rule: live-control, metric: 2 }

    not_contains:
      - { event: ntfy_post, rule: truthy-where }
      - { event: ntfy_post, rule: open-world-where }

    order:
      - before: { event: rule_response, kind: put, id: truthy-where }
        after:  { event: ntfy_post, rule: live-control }

    count:
      - match: { event: ntfy_post, rule: live-control }
        equals: 2
      - match: { event: ntfy_post }
        equals: 2

    field_exists:
      - match: { event: ntfy_post, rule: live-control }
        field: node
